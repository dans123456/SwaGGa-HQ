    <!-- Global JavaScript Error Boundary for debugging browser-side blocks -->
    <script>
      window.showGlobalError = function(title, errorMsg, fixMsg) {
        // Prevent duplicate overlays
        if (document.getElementById('global-error-overlay')) return;

        var div = document.createElement('div');
        div.id = 'global-error-overlay';
        div.style.position = 'fixed';
        div.style.top = '20px';
        div.style.left = '20px';
        div.style.right = '20px';
        div.style.background = '#8e0e00';
        div.style.color = '#fff';
        div.style.padding = '24px';
        div.style.borderRadius = '16px';
        div.style.zIndex = '999999';
        div.style.fontFamily = "'Outfit', sans-serif";
        div.style.fontSize = '14px';
        div.style.lineHeight = '1.6';
        div.style.boxShadow = '0 24px 60px rgba(0,0,0,0.7), 0 0 40px rgba(142, 14, 0, 0.4)';
        div.style.border = '1px solid rgba(255, 255, 255, 0.2)';

        // Title
        var titleEl = document.createElement('div');
        titleEl.style.fontSize = '18px';
        titleEl.style.fontWeight = '800';
        titleEl.style.marginBottom = '12px';
        titleEl.style.display = 'flex';
        titleEl.style.alignItems = 'center';
        titleEl.style.gap = '8px';
        titleEl.textContent = '⚠️ ' + title;
        div.appendChild(titleEl);

        // Body message
        var bodyEl = document.createElement('div');
        var parser = new DOMParser();
        var bodyDoc = parser.parseFromString('<div>' + errorMsg + '</div>', 'text/html');
        var bodyScripts = bodyDoc.querySelectorAll('script');
        for (var i = 0; i < bodyScripts.length; i++) {
          bodyScripts[i].remove();
        }
        bodyEl.appendChild(bodyDoc.body.firstChild || document.createTextNode(errorMsg));
        div.appendChild(bodyEl);

        var br = document.createElement('br');
        div.appendChild(br);

        // Fix message container
        var fixEl = document.createElement('div');
        fixEl.style.background = 'rgba(0,0,0,0.25)';
        fixEl.style.border = '1px solid rgba(255,255,255,0.1)';
        fixEl.style.padding = '12px';
        fixEl.style.borderRadius = '8px';

        var fixTitle = document.createElement('strong');
        fixTitle.textContent = '💡 How to Fix: ';
        fixEl.appendChild(fixTitle);

        var fixMsgSpan = document.createElement('span');
        var fixDoc = parser.parseFromString('<span>' + fixMsg + '</span>', 'text/html');
        var fixScripts = fixDoc.querySelectorAll('script');
        for (var j = 0; j < fixScripts.length; j++) {
          fixScripts[j].remove();
        }
        fixMsgSpan.appendChild(fixDoc.body.firstChild || document.createTextNode(fixMsg));
        fixEl.appendChild(fixMsgSpan);
        div.appendChild(fixEl);

        // Close button
        var closeBtn = document.createElement('button');
        closeBtn.textContent = '✕';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '16px';
        closeBtn.style.right = '16px';
        closeBtn.style.background = 'transparent';
        closeBtn.style.border = 'none';
        closeBtn.style.color = 'rgba(255,255,255,0.7)';
        closeBtn.style.fontSize = '18px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.padding = '4px';
        closeBtn.addEventListener('click', function() {
          div.remove();
        });
        div.appendChild(closeBtn);

        document.body.appendChild(div);
      };

      window.addEventListener('error', function(e) {
        console.error("GLOBAL ERROR DETECTED:", e);
        var filename = e.filename || '';
        // Only trigger overlay for our own local app scripts to avoid extension interference
        var isLocal = filename.indexOf(window.location.origin) > -1 || 
                      filename.indexOf('js/') > -1 || 
                      filename.startsWith('/') || 
                      filename.startsWith('.') || 
                      !filename;
        var isExtension = filename.indexOf('chrome-extension') > -1 || 
                          filename.indexOf('moz-extension') > -1;

        if (!isLocal || isExtension) {
          console.warn('Ignoring external script error:', e.message, 'from', filename);
          return;
        }

        var msg = e.message || 'Script failed to load (likely blocked by browser security shields or tracking protection).';
        var file = filename ? filename.split('/').pop() : 'Unknown Script';
        var line = e.lineno || '?';
        window.showGlobalError(
          'Browser Script Blocked!',
          'Crucial application scripts failed to run.<br><strong>Error:</strong> ' + msg + ' (' + file + ':' + line + ')',
          'Firefox\'s Enhanced Tracking Protection or a browser extension is blocking local scripts. Click the <strong>Shield Icon</strong> next to the URL bar and toggle Enhanced Tracking Protection <strong>OFF</strong>, then refresh!'
        );
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error("UNHANDLED REJECTION:", e.reason);
        var msg = (e.reason && e.reason.message) || String(e.reason);
        var code = (e.reason && e.reason.code) || 'N/A';

        // ONLY trigger overlay for Firebase Auth / Storage related rejections
        var isAuthError = (code && typeof code === 'string' && code.indexOf('auth/') > -1) ||
                          (msg && typeof msg === 'string' && (msg.indexOf('auth') > -1 || msg.indexOf('Firebase') > -1 || msg.indexOf('Google') > -1));
        if (!isAuthError) {
          console.warn('Ignoring non-auth unhandled rejection:', msg);
          return;
        }
        
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        var fixMsg = 'Firefox restricts cross-domain storage on local servers (127.0.0.1). Click the <strong>Shield Icon</strong> next to the URL bar and toggle "Enhanced Tracking Protection" <strong>OFF</strong> for SwaGGa HQ, then refresh and try again!';
        
        if (isMobile) {
          if (isStandalone) {
            fixMsg = 'Mobile operating systems strictly block cross-domain authentication inside standalone PWAs when served from third-party hosting.<br><br>' +
                     '✨ <strong>Solution:</strong> Open SwaGGa HQ using the official first-party Firebase URL: <br>' +
                     '<a href="https://swagga-hq.firebaseapp.com" target="_blank" style="color: #00d4ff; font-weight: 700; text-decoration: underline;">https://swagga-hq.firebaseapp.com</a> or ' +
                     '<a href="https://swagga-hq.web.app" target="_blank" style="color: #00d4ff; font-weight: 700; text-decoration: underline;">https://swagga-hq.web.app</a> ' +
                     'in your phone\'s Safari or Chrome browser. Google Sign-In works flawlessly there, and you can re-install the PWA directly from that domain!';
          } else {
            fixMsg = 'Mobile browsers block cross-domain cookies and storage partition access by default.<br><br>' +
                     '✨ <strong>Solution:</strong> Open the app on the official Firebase hosting URL: <br>' +
                     '<a href="https://swagga-hq.firebaseapp.com" target="_blank" style="color: #00d4ff; font-weight: 700; text-decoration: underline;">https://swagga-hq.firebaseapp.com</a> ' +
                     'which runs on the first-party authentication domain, OR go to your phone\'s Settings > Safari and toggle <strong>Prevent Cross-Site Tracking OFF</strong>.';
          }
        } else {
          var isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1;
          if (!isFirefox) {
            fixMsg = 'Your browser is blocking cross-origin storage or cookies. Disable tracking shields, Brave shields, or adblockers for this site, or run the app on the first-party hosting domain: ' +
                     '<a href="https://swagga-hq.firebaseapp.com" target="_blank" style="color: #00d4ff; font-weight: 700; text-decoration: underline;">https://swagga-hq.firebaseapp.com</a>.';
          }
        }

        window.showGlobalError(
          'Sign-In / Firebase Error!',
          'Firebase encountered a storage or security shield restriction.<br><strong>Details:</strong> ' + msg + ' (Code: ' + code + ')',
          fixMsg
        );
      });
    </script>
</head>
<body>
    <!-- App root — all DOM built dynamically by app.js for security (no innerHTML with user data) -->
    <div id="app">
      <!-- Premium Loading Fallback (removed automatically once app.js successfully mounts) -->
      <div id="app-loading-fallback" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; text-align: center; padding: 20px; box-sizing: border-box; background: linear-gradient(160deg, #0d0b0f 0%, #1f1c18 40%, #0d0b0f 100%);">
        <div style="font-size: 48px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.4));">⚡</div>
        <div style="font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #fff 0%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Loading SwaGGa HQ...</div>
        <div style="font-size: 14px; max-width: 440px; line-height: 1.7; color: rgba(255,255,255,0.6); font-family: 'Inter', sans-serif;">
          If this screen stays dark, your browser is serving a stale offline cache or a security shield is blocking the scripts.<br><br>
          <div style="display: inline-block; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; color: #00d4ff; font-weight: 600; font-size: 13px;">
            Press <strong>Ctrl + Shift + R</strong> (or <strong>Cmd + Shift + R</strong> on Mac) to refresh fresh!
          </div>
        </div>
      </div>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('SW registered, scope:', reg.scope);
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
</body>
