<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SwaGGa HQ — Your personal command center for trading, learning, and daily habit tracking.">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>SwaGGa HQ — Personal Command Center</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0b0f">
    <link rel="icon" type="image/png" href="img/icon-512.png">
    <link rel="apple-touch-icon" href="img/icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwaGGa HQ">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js from CDN -->
    <!-- TODO(security): Pin exact version and add SRI hash when deploying to production -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>

    <!-- TradingView Widget Library -->
    <script src="https://s3.tradingview.com/tv.js" defer></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/trading.css">
    <link rel="stylesheet" href="css/learning.css">
    <!-- Global JavaScript Error Boundary for debugging browser-side blocks -->
    <script>
      window.addEventListener('error', function(e) {
        console.error("GLOBAL ERROR DETECTED:", e);
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '20px';
        div.style.left = '20px';
        div.style.right = '20px';
        div.style.background = '#8e0e00';
        div.style.color = '#fff';
        div.style.padding = '20px';
        div.style.borderRadius = '12px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'sans-serif';
        div.style.fontSize = '13px';
        div.style.lineHeight = '1.6';
        div.style.boxShadow = '0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(142, 14, 0, 0.3)';
        div.style.border = '1px solid rgba(255, 255, 255, 0.15)';
        
        var msg = e.message || 'Script failed to load (likely blocked by browser security shields or tracking protection).';
        var file = e.filename ? e.filename.split('/').pop() : 'Unknown Script';
        var line = e.lineno || '?';
        
        div.innerHTML = '<div style="font-size: 16px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">⚠️ Browser Script Block Detected!</div>' +
                        'Your browser or tracking shields are blocking a crucial file from loading.<br><br>' +
                        '<strong>Error:</strong> <span style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">' + msg + '</span><br>' +
                        '<strong>File:</strong> ' + file + ' | <strong>Line:</strong> ' + line + '<br><br>' +
                        '<div style="font-size: 11px; color: rgba(255,255,255,0.7);">💡 <strong>Fix:</strong> Click the shield icon in Firefox\'s URL bar and toggle "Enhanced Tracking Protection" OFF, or try opening this link in Google Chrome!</div>';
        document.body.appendChild(div);
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error("UNHANDLED REJECTION:", e.reason);
      });
    </script>
</head>
<body>
    <!-- App root — all DOM built dynamically by app.js for security (no innerHTML with user data) -->
    <div id="app">
      <!-- Premium Loading Fallback (removed automatically once app.js successfully mounts) -->
      <div id="app-loading-fallback" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; text-align: center; padding: 20px; box-sizing: border-box; background: linear-gradient(160deg, #0d0b0f 0%, #1f1c18 40%, #0d0b0f 100%);">
        <div style="font-size: 48px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.4));">⚡</div>
        <div style="font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #fff 0%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Loading SwaGGa HQ...</div>
        <div style="font-size: 14px; max-width: 440px; line-height: 1.7; color: rgba(255,255,255,0.6); font-family: 'Inter', sans-serif;">
          If this screen stays dark, your browser is serving a stale offline cache or a security shield is blocking the scripts.<br><br>
          <div style="display: inline-block; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; color: #00d4ff; font-weight: 600; font-size: 13px;">
            Press <strong>Ctrl + Shift + R</strong> (or <strong>Cmd + Shift + R</strong> on Mac) to refresh fresh!
          </div>
        </div>
      </div>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('SW registered, scope:', reg.scope);
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
</body>
</html>
